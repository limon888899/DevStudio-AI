name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          gradle assembleDebug --console=plain > build.log 2>&1 || { grep -E "^e: |What went wrong" -A3 build.log | head -80; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: DevStudioAI-debug
          path: app/build/outputs/apk/debug/*.apk
